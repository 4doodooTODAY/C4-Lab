<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/c4c-badge.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>C4C Lab — Connect Four Creative</title>

    <!-- Installable app (Add to Home Screen) -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#160530" />
    <meta name="description" content="Shoots, edits, reviews, and approvals for your whole team, in one place." />

    <!-- iOS needs its own tags; it ignores most of the manifest -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="C4C Lab" />
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try { document.documentElement.dataset.theme = localStorage.getItem('c4lab_theme') || 'dark' } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
